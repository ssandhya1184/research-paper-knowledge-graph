xamples_interpretation"}, {"arrows": "to", "from": "method::ontology_alignment", "label": "studies", "title": "studies", "to": "dataset::ontology_alignment_benchmark"}, {"arrows": "to", "from": "concept::cooperative_query_answering", "label": "uses", "title": "uses", "to": "dataset::ontology_alignment_benchmark"}, {"arrows": "to", "from": "concept::cooperative_query_answering", "label": "measured by", "title": "measured by", "to": "metric::precision"}, {"arrows": "to", "from": "concept::cooperative_query_answering", "label": "measured by", "title": "measured by", "to": "metric::recall"}]);
