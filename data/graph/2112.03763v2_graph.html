                  nodes = new vis.DataSet([{"font": {"color": "#222222"}, "group": "Paper", "id": "paper::2112.03763v2", "label": "Creating Multimodal Interactive Agents with Imitation and Self-Supervised Learning", "shape": "dot", "title": "Paper: Creating Multimodal Interactive Agents with Imitation and Self-Supervised Learning\n"}, {"font": {"color": "#222222"}, "group": "Method", "id": "method::imitation_learning", "label": "Imitation Learning", "shape": "dot", "title": "Method: Imitation Learning\nLearning from human demonstrations to instill intelligent behavioural priors in agents."}, {"font": {"color": "#222222"}, "group": "Method", "id": "method::self_supervised_learning", "label": "Self-Supervised Learning", "shape": "dot", "title": "Method: Self-Supervised Learning\nAuxiliary training objective used in conjunction with imitation learning to improve performance."}, {"font": {"color": "#222222"}, "group": "Method", "id": "method::behavioural_cloning_bc", "label": "Behavioural Cloning (BC)", "shape": "dot", "title": "Method: Behavioural Cloning (BC)\nSequence learning technique used for imitation learning from trajectories of human behaviour."}, {"font": {"color": "#222222"}, "group": "Method", "id": "method::hierarchical_action_selection", "label": "Hierarchical Action Selection", "shape": "dot", "title": "Method: Hierarchical Action Selection\nArchitectural technique that improves agent performance, implemented via a hierarchical movement policy."}, {"font": {"color": "#222222"}, "group": "Dataset", "id": "dataset::playhouse_dataset", "label": "Playhouse Dataset", "shape": "dot", "title": "Dataset: Playhouse Dataset\nDataset collected in the Playhouse environment comprising 275,676 train episodes and 34,399 test episodes."}, {"font": {"color": "#222222"}, "group": "Concept", "id": "concept::mia_multimodal_interactive_agent", "label": "MIA (Multimodal Interactive Agent)", "shape": "dot", "title": "Concept: MIA (Multimodal Interactive Agent)\nA multimodal interactive agent that interacts naturally with humans in a simulated world."}, {"font": {"color": "#222222"}, "group": "Concept", "id": "concept::playhouse", "label": "Playhouse", "shape": "dot", "title": "Concept: Playhouse\nA 3D virtual multi-room environment based on the Unity game engine for studying natural interactions."}, {"font": {"color": "#222222"}, "group": "Concept", "id": "concept::language_games", "label": "Language Games", "shape": "dot", "title": "Concept: Language Games\nA collection of prompted interaction-types and free-form instructions centering Playhouse interactions."}, {"font": {"color": "#222222"}, "group": "Finding", "id": "finding::agent_success_rate", "label": "Agent Success Rate", "shape": "dot", "title": "Finding: Agent Success Rate\nMIA successfully interacts with non-adversarial humans 75% of the time."}]);

};
