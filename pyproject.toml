
[project]
name = "research-paper-knowledge-graph"
version = "0.1.0"
description = "Autonomous Research Paper Summarization and Knowledge Graph Builder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arxiv",
    "chromadb>=1.5.9",
    "gradio>=6.30.0",
    "langchain-google-genai>=4.4.2",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.16",
    "networkx>=3.6.1",
    "pymupdf",
    "pyvis>=0.3.2",
    "rapidfuzz>=3.14.6",
    "sentence-transformers>=6.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_assistant"]
